name: gh-secret-kit-dependabot-copy
run-name: gh-secret-kit-dependabot-copy-1789749258727397000
on:
  push:
    branches:
      - dependabot/**
permissions:
  contents: read
jobs:
  copy-dependabot-secrets:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Copy Dependabot secrets
        run: |
          set -euo pipefail

          unset GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN GH_HOST GH_REPO

          echo "Copying secrets to srz-zumix/yurumikuji (github.com)"
          export GH_HOST='github.com'
          export GH_TOKEN="${GH_SECRET_KIT_COPY_TOKEN_1789749258727397000_GITHUB_COM}"
          unset GH_ENTERPRISE_TOKEN
          export DESTINATION='srz-zumix/yurumikuji'

          SECRET_VALUE="${SLACK_CHANNEL_ID-}"
          (
          if [ -z "${SECRET_VALUE}" ]; then
            echo "Secret SLACK_CHANNEL_ID is empty or does not exist, skipping..."
            exit 0
          fi

          # Check if secret already exists at destination
          if ! _existing_secrets="$(gh secret list -R "${DESTINATION}" --app agents)"; then
            echo "Failed to list destination secrets while checking SLACK_CHANNEL_ID" >&2
            exit 1
          fi
          if printf '%s\n' "${_existing_secrets}" | grep -E "^SLACK_CHANNEL_ID([[:space:]]|$)" >/dev/null; then
            echo "Secret SLACK_CHANNEL_ID already exists at destination, skipping..."
            exit 0
          fi

          # Set secret SLACK_CHANNEL_ID at destination
          printf '%s\n' "${SECRET_VALUE}" | \
            gh secret set SLACK_CHANNEL_ID -R "${DESTINATION}" --app agents
          echo "Successfully migrated secret: SLACK_CHANNEL_ID -> SLACK_CHANNEL_ID"
          )

          SECRET_VALUE="${SLACK_TOKEN-}"
          (
          if [ -z "${SECRET_VALUE}" ]; then
            echo "Secret SLACK_TOKEN is empty or does not exist, skipping..."
            exit 0
          fi

          # Check if secret already exists at destination
          if ! _existing_secrets="$(gh secret list -R "${DESTINATION}" --app agents)"; then
            echo "Failed to list destination secrets while checking SLACK_TOKEN" >&2
            exit 1
          fi
          if printf '%s\n' "${_existing_secrets}" | grep -E "^SLACK_TOKEN([[:space:]]|$)" >/dev/null; then
            echo "Secret SLACK_TOKEN already exists at destination, skipping..."
            exit 0
          fi

          # Set secret SLACK_TOKEN at destination
          printf '%s\n' "${SECRET_VALUE}" | \
            gh secret set SLACK_TOKEN -R "${DESTINATION}" --app agents
          echo "Successfully migrated secret: SLACK_TOKEN -> SLACK_TOKEN"
          )

          echo 'gh-secret-kit: dependabot secret copy finished'
        shell: bash
        env:
          GH_SECRET_KIT_COPY_TOKEN_1789749258727397000_GITHUB_COM: ${{ secrets.GH_SECRET_KIT_COPY_TOKEN_1789749258727397000_GITHUB_COM }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
